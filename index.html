<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasFoto Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b132b] text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#1c2541]/80 backdrop-blur-lg rounded-2xl border border-slate-700/40 p-8 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl mb-4 border border-blue-500/30">
                <i class="fa-solid fa-camera text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">PasFoto Studio</h1>
            <p class="text-sm text-slate-400 mt-1" id="form-subtitle">Masuk ke Akun Anda</p>
        </div>

        <!-- Alert Box -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <!-- Form Login -->
        <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="login-username" required class="w-full pl-11 pr-4 py-3 bg-[#0b132b]/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-blue-500 text-white text-sm" placeholder="Masukkan username">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="password" id="login-password" required class="w-full pl-11 pr-4 py-3 bg-[#0b132b]/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-blue-500 text-white text-sm" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <button type="button" onclick="switchTab('recovery')" class="text-blue-400 hover:text-blue-300">Lupa Username / Password?</button>
            </div>

            <button type="submit" id="btn-login" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-blue-600/30 text-sm mt-2">
                Masuk
            </button>
        </form>

        <!-- Form Register -->
        <form id="register-form" class="space-y-4 hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="email" id="reg-email" required class="w-full pl-11 pr-4 py-3 bg-[#0b132b]/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-blue-500 text-white text-sm" placeholder="nama@email.com">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="reg-username" required class="w-full pl-11 pr-4 py-3 bg-[#0b132b]/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-blue-500 text-white text-sm" placeholder="Username baru">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="password" id="reg-password" required class="w-full pl-11 pr-4 py-3 bg-[#0b132b]/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-blue-500 text-white text-sm" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="btn-register" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-blue-600/30 text-sm mt-2">
                Daftar Sekarang
            </button>
        </form>

        <!-- Form Recovery -->
        <form id="recovery-form" class="space-y-4 hidden" onsubmit="handleSendCode(event)">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Terdaftar</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="email" id="rec-email" required class="w-full pl-11 pr-4 py-3 bg-[#0b132b]/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-blue-500 text-white text-sm" placeholder="nama@email.com">
                </div>
            </div>

            <button type="submit" id="btn-send-code" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm">
                Kirim Kode Verifikasi
            </button>
        </form>

        <!-- Form Verify Code -->
        <form id="verify-form" class="space-y-4 hidden" onsubmit="handleVerifyCode(event)">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Kode Verifikasi Email</label>
                <input type="text" id="ver-code" required class="w-full px-4 py-3 bg-[#0b132b]/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-blue-500 text-white text-center font-mono text-lg uppercase tracking-widest" placeholder="ABCDEF">
            </div>

            <button type="submit" id="btn-verify" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm">
                Verifikasi Kode
            </button>
        </form>

        <!-- Dashboard User -->
        <div id="dashboard-view" class="hidden text-center space-y-4">
            <div class="p-6 bg-[#0b132b]/60 rounded-xl border border-slate-700/50">
                <i class="fa-solid fa-circle-check text-4xl text-emerald-400 mb-3"></i>
                <h2 class="text-xl font-bold text-white">Login Berhasil!</h2>
                <p class="text-sm text-slate-400 mt-2" id="user-welcome-text"></p>
                <button onclick="switchTab('login')" class="mt-6 px-6 py-2 bg-red-600/20 border border-red-500/30 text-red-400 hover:bg-red-600/30 text-sm rounded-xl">
                    Keluar / Logout
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-6 pt-6 border-t border-slate-700/50 text-center text-xs text-slate-400" id="footer-nav">
            <span id="nav-text">Belum punya akun?</span>
            <button type="button" onclick="toggleAuthMode()" id="nav-btn" class="ml-1 text-blue-400 hover:text-blue-300 font-semibold">Daftar sekarang</button>
        </div>

    </div>

    <script>
        let currentTab = 'login';

        function showAlert(msg, isError = true) {
            const box = document.getElementById('alert-box');
            box.innerText = msg;
            box.className = `mb-6 p-4 rounded-xl text-sm font-medium ${isError ? 'bg-red-500/20 border border-red-500/40 text-red-300' : 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300'}`;
            box.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        function switchTab(tab) {
            currentTab = tab;
            hideAlert();

            ['login-form', 'register-form', 'recovery-form', 'verify-form', 'dashboard-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });

            const subtitle = document.getElementById('form-subtitle');
            const footerNav = document.getElementById('footer-nav');

            if (tab === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                subtitle.innerText = 'Masuk ke Akun Anda';
                footerNav.classList.remove('hidden');
                document.getElementById('nav-text').innerText = 'Belum punya akun?';
                document.getElementById('nav-btn').innerText = 'Daftar sekarang';
            } else if (tab === 'register') {
                document.getElementById('register-form').classList.remove('hidden');
                subtitle.innerText = 'Buat Akun Baru';
                footerNav.classList.remove('hidden');
                document.getElementById('nav-text').innerText = 'Sudah punya akun?';
                document.getElementById('nav-btn').innerText = 'Login di sini';
            } else if (tab === 'recovery') {
                document.getElementById('recovery-form').classList.remove('hidden');
                subtitle.innerText = 'Pemulihan Akun';
                footerNav.classList.remove('hidden');
                document.getElementById('nav-text').innerText = 'Kembali ke';
                document.getElementById('nav-btn').innerText = 'Halaman Login';
            } else if (tab === 'verify') {
                document.getElementById('verify-form').classList.remove('hidden');
                subtitle.innerText = 'Verifikasi Kode Email';
                footerNav.classList.add('hidden');
            } else if (tab === 'dashboard') {
                document.getElementById('dashboard-view').classList.remove('hidden');
                subtitle.innerText = 'Panel Pengguna';
                footerNav.classList.add('hidden');
            }
        }

        function toggleAuthMode() {
            if (currentTab === 'login') switchTab('register');
            else switchTab('login');
        }

        async function sendRequest(url, payload) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return await res.json();
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideAlert();
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.innerText = 'Memproses...';

            try {
                const data = await sendRequest('/api/login', {
                    username: document.getElementById('login-username').value,
                    password: document.getElementById('login-password').value
                });

                if (data.status === 'success') {
                    document.getElementById('user-welcome-text').innerText = `Halo @${data.user.username} (${data.user.email})`;
                    switchTab('dashboard');
                } else {
                    showAlert(data.message || 'Login gagal!');
                }
            } catch (err) {
                showAlert('Gagal terhubung ke server.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Masuk';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideAlert();
            const btn = document.getElementById('btn-register');
            btn.disabled = true;
            btn.innerText = 'Memproses...';

            try {
                const data = await sendRequest('/api/register', {
                    email: document.getElementById('reg-email').value,
                    username: document.getElementById('reg-username').value,
                    password: document.getElementById('reg-password').value
                });

                if (data.status === 'success') {
                    showAlert('Registrasi berhasil! Silakan login.', false);
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showAlert(data.message || 'Registrasi gagal!');
                }
            } catch (err) {
                showAlert('Gagal terhubung ke server.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Daftar Sekarang';
            }
        }

        async function handleSendCode(e) {
            e.preventDefault();
            hideAlert();
            const btn = document.getElementById('btn-send-code');
            btn.disabled = true;
            btn.innerText = 'Mengirim...';

            try {
                const data = await sendRequest('/api/send-code', {
                    email: document.getElementById('rec-email').value
                });

                if (data.status === 'success') {
                    showAlert('Kode verifikasi telah dikirim ke email!', false);
                    setTimeout(() => switchTab('verify'), 1500);
                } else {
                    showAlert(data.message || 'Gagal mengirim kode.');
                }
            } catch (err) {
                showAlert('Kesalahan jaringan.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Kirim Kode Verifikasi';
            }
        }

        async function handleVerifyCode(e) {
            e.preventDefault();
            hideAlert();
            const btn = document.getElementById('btn-verify');
            btn.disabled = true;
            btn.innerText = 'Memverifikasi...';

            try {
                const data = await sendRequest('/api/verify-code', {
                    email: document.getElementById('rec-email').value,
                    code: document.getElementById('ver-code').value
                });

                if (data.status === 'success') {
                    showAlert(`Username: @${data.user.username} | Password berhasil diperbarui!`, false);
                } else {
                    showAlert(data.message || 'Kode tidak valid.');
                }
            } catch (err) {
                showAlert('Kesalahan jaringan.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Verifikasi Kode';
            }
        }
    </script>
</body>
</html>
